
services:
  backend:
    build: ./backend
    container_name: inventory-backend
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: inventory-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

